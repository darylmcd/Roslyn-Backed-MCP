version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # MSTest framework/adapter/analyzers are version-paired and their analyzers
      # gate compilation, so ALL their updates (majors included) must move in one
      # PR — previously the major bump fanned out into separate uncoordinated PRs
      # (TestFramework alone mismatches TestAdapter).
      mstest:
        patterns:
          - "MSTest*"
      # These compile-time references must remain version-identical and use
      # PrivateAssets/ExcludeAssets together. Include scheduled majors so
      # version-update PRs cannot repeat PR #1327's split Microsoft.Build shape;
      # a split security PR remains fail-closed at package-family validation.
      msbuild-compile-family:
        patterns:
          - "Microsoft.Build"
          - "Microsoft.Build.Framework"
          - "Microsoft.Build.Tasks.Core"
          - "Microsoft.Build.Utilities.Core"
      # Production and analyzer projects share one Roslyn ABI. Exact patterns
      # avoid pulling independently versioned analyzer/testing packages along.
      roslyn-api-family:
        patterns:
          - "Microsoft.CodeAnalysis.CSharp"
          - "Microsoft.CodeAnalysis.Analyzers"
          - "Microsoft.CodeAnalysis.CSharp.Workspaces"
          - "Microsoft.CodeAnalysis.CSharp.Features"
          - "Microsoft.CodeAnalysis.Features"
          - "Microsoft.CodeAnalysis.Workspaces.MSBuild"
          - "Microsoft.CodeAnalysis.CSharp.Scripting"
      extensions-runtime-family:
        patterns:
          - "Microsoft.Extensions.Hosting"
          - "Microsoft.Extensions.Http"
          - "Microsoft.Extensions.Logging"
          - "Microsoft.Extensions.Logging.Console"
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "MSTest*"
          - "Microsoft.Build"
          - "Microsoft.Build.Framework"
          - "Microsoft.Build.Tasks.Core"
          - "Microsoft.Build.Utilities.Core"
          - "Microsoft.CodeAnalysis.CSharp"
          - "Microsoft.CodeAnalysis.Analyzers"
          - "Microsoft.CodeAnalysis.CSharp.Workspaces"
          - "Microsoft.CodeAnalysis.CSharp.Features"
          - "Microsoft.CodeAnalysis.Features"
          - "Microsoft.CodeAnalysis.Workspaces.MSBuild"
          - "Microsoft.CodeAnalysis.CSharp.Scripting"
          - "Microsoft.Extensions.Hosting"
          - "Microsoft.Extensions.Http"
          - "Microsoft.Extensions.Logging"
          - "Microsoft.Extensions.Logging.Console"
          # MCP SDK updates require a dedicated ADR/wire/notices review and
          # therefore must never share the routine servicing PR.
          - "ModelContextProtocol"

    # MSBuild 18.x is blocked, not merely unreviewed. Bumping the
    # msbuild-compile-family to 18.x drags Microsoft.NET.StringTools 18.x in
    # transitively, and Microsoft.Build.Locator 1.11.2 then fails the build with
    # MSBL001 because StringTools carries no ExcludeAssets="runtime"
    # PrivateAssets="all" of its own (the four Microsoft.Build.* refs in
    # RoslynMcp.Roslyn.csproj already have it; StringTools is unpinned).
    # PR #1330 was closed on this basis.
    #
    # Lift this ignore only when BOTH hold:
    #   1. Microsoft.NET.StringTools is centrally pinned in
    #      Directory.Packages.props and referenced with ExcludeAssets="runtime"
    #      PrivateAssets="all", matching the existing Microsoft.Build.* refs; and
    #   2. a green sdk-floor leg proves MSBL001 is satisfied at the 10.0.400 floor.
    ignore:
      - dependency-name: "Microsoft.Build"
        versions: [">=18.0.0"]
      - dependency-name: "Microsoft.Build.Framework"
        versions: [">=18.0.0"]
      - dependency-name: "Microsoft.Build.Tasks.Core"
        versions: [">=18.0.0"]
      - dependency-name: "Microsoft.Build.Utilities.Core"
        versions: [">=18.0.0"]

      # Roslyn above 5.9 is blocked by the SDK floor, not merely unreviewed.
      # Each stable Roslyn version ships with one SDK band (5.9 = 10.0.4xx,
      # 5.12 = 11.0.100). RoslynMcp.Host.Stdio loads the in-repo analyzer, which
      # is built against the central Roslyn pin, so a pin newer than the
      # compiler of the global.json SDK floor fails the build with CS9057.
      # Microsoft.CodeAnalysis.Workspaces.MSBuild 5.12.0 also requires
      # Microsoft.Build.Framework 18.7.1, which the MSBuild 18.x block above
      # forbids. PR #2126 was closed on this basis.
      #
      # Lift these ignores only as part of backlog row
      # dotnet-11-sdk-roslyn-5-12-migration (SDK floor, MSBuild 18.x and the
      # Roslyn API family move in one reviewed change with an ADR).
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
        versions: [">=5.10.0"]
      - dependency-name: "Microsoft.CodeAnalysis.Analyzers"
        versions: [">=5.10.0"]
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Workspaces"
        versions: [">=5.10.0"]
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Features"
        versions: [">=5.10.0"]
      - dependency-name: "Microsoft.CodeAnalysis.Features"
        versions: [">=5.10.0"]
      - dependency-name: "Microsoft.CodeAnalysis.Workspaces.MSBuild"
        versions: [">=5.10.0"]
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Scripting"
        versions: [">=5.10.0"]

      # The Extensions runtime family stays on the 10.0.x servicing line while
      # the target framework is net10.0 (docs/upgrade-matrix.md sections 1 and
      # 3). Dependabot's 11.0.0 proposal (PR #2127) also dragged
      # Microsoft.CodeAnalysis.Workspaces.MSBuild to 5.12.0 on its own, which
      # splits the Roslyn API family and fails restore with NU1107. The move to
      # the 11.x line is decided in the same migration row as above.
      - dependency-name: "Microsoft.Extensions.Hosting"
        versions: [">=11.0.0"]
      - dependency-name: "Microsoft.Extensions.Http"
        versions: [">=11.0.0"]
      - dependency-name: "Microsoft.Extensions.Logging"
        versions: [">=11.0.0"]
      - dependency-name: "Microsoft.Extensions.Logging.Console"
        versions: [">=11.0.0"]
