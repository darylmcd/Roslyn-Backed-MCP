name: publish-nuget

# Triggered on version tag push, GitHub Release creation, or manual dispatch.
# Requires the NUGET_API_KEY repository secret (Push scope, from nuget.org/account/apikeys).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — validate and pack but do NOT push to NuGet'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    # Verify + pack + push is ~15 min on hosted ubuntu; without an explicit budget a
    # hung step holds the 6-hour default on the release path.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      # Fails in seconds when the pushed tag / published release name disagrees with the
      # canonical Directory.Build.props <Version>. Must precede the build so a mistag never
      # reaches pack/push (--skip-duplicate silently no-ops) or the tag-derived registry job.
      - name: Verify release provenance (tag matches canonical version)
        shell: pwsh
        # Context values reach the script as ENVIRONMENT VARIABLES, never as ${{ }}
        # interpolated into the run: body. github.event.release.tag_name is
        # attacker-controlled (anyone who can cut a release names the tag); substituted
        # into the command text it would close the quote and execute arbitrary code in a
        # job that holds NUGET_API_KEY.
        env:
          PUBLISH_EVENT_NAME: ${{ github.event_name }}
          PUBLISH_REF_NAME: ${{ github.ref_name }}
          PUBLISH_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: ./eng/verify-publish-version-context.ps1 -EventName $env:PUBLISH_EVENT_NAME -RefName $env:PUBLISH_REF_NAME -ReleaseTag $env:PUBLISH_RELEASE_TAG

      # -NoCoverage: the release path only validates + packs; the coverage HTML/artifact
      # is never consumed here, so collecting it (~60-90s of coverlet IL-rewrite) is pure
      # waste on the publish run.
      - name: Verify release build (version drift + build + test + publish)
        shell: pwsh
        run: ./eng/verify-release.ps1 -Configuration Release -NoCoverage -RequireConsumedFragments

      - name: Pack NuGet package
        shell: pwsh
        run: |
          dotnet pack src/RoslynMcp.Host.Stdio/RoslynMcp.Host.Stdio.csproj `
            -c Release `
            --no-build `
            -o nupkg

      - name: Verify package contents
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem -Path nupkg -Filter "*.nupkg" | Select-Object -First 1
          $snupkg = Get-ChildItem -Path nupkg -Filter "*.snupkg" | Select-Object -First 1
          if (-not $nupkg) { throw "No .nupkg found in nupkg/" }
          if (-not $snupkg) { throw "No .snupkg found in nupkg/" }
          Write-Host "Package: $($nupkg.Name) ($([math]::Round($nupkg.Length / 1MB, 2)) MB)"
          Write-Host "Symbols: $($snupkg.Name) ($([math]::Round($snupkg.Length / 1MB, 2)) MB)"

          # A .nupkg is a ZIP. Unzip it and assert the two MCP-gallery-critical bits the size
          # check can't see: a csproj regression dropping <PackageType>McpServer</PackageType> or
          # the .mcp/server.json embed would still pass size + push a tool-only package on green
          # CI, silently delisting us from the NuGet MCP gallery. Fail closed on either miss.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
          try {
            $nuspecEntry = $zip.Entries | Where-Object { $_.FullName -like "*.nuspec" } | Select-Object -First 1
            if (-not $nuspecEntry) { throw "No .nuspec found inside $($nupkg.Name)" }
            $reader = New-Object System.IO.StreamReader($nuspecEntry.Open())
            try { $nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($nuspec -notmatch '<packageType\s+name="McpServer"') {
              throw "nuspec is missing <packageType name=`"McpServer`" /> — csproj regression dropped <PackageType>McpServer</PackageType>; package would NOT list on the NuGet MCP gallery."
            }
            if (-not ($zip.Entries | Where-Object { $_.FullName -eq '.mcp/server.json' })) {
              throw "Package is missing the .mcp/server.json embed — csproj regression dropped the <None Include> pack item; the NuGet MCP gallery 'MCP Server' tab would not render."
            }
            Write-Host "Verified: McpServer packageType + .mcp/server.json embed present."
          } finally {
            $zip.Dispose()
          }

      - name: Push to NuGet
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || !inputs.dry_run }}
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw "NUGET_API_KEY secret is not set. Add it in Settings > Secrets and variables > Actions."
          }
          $nupkg = Get-ChildItem -Path nupkg -Filter "*.nupkg" | Select-Object -First 1
          dotnet nuget push $nupkg.FullName `
            --source https://api.nuget.org/v3/index.json `
            --api-key $env:NUGET_API_KEY `
            --skip-duplicate

      - name: Dry run notice
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: echo "Dry run — package was built and validated but NOT pushed to NuGet."

      - name: Upload NuGet packages as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages
          path: nupkg/

  # Publishes .claude-plugin/server.json to the official MCP Registry
  # (registry.modelcontextprotocol.io) after the NuGet package is live. Uses
  # GitHub OIDC to prove ownership of the io.github.darylmcd/* namespace — no PAT
  # or secret required. Runs only on a real tag/release publish, never on a
  # workflow_dispatch dry run. See https://modelcontextprotocol.io/registry/github-actions
  publish-registry:
    needs: publish
    runs-on: ubuntu-latest
    # The NuGet-README poll alone can legitimately take 20 min (80 × 15s); 30 gives
    # headroom without leaving the 6-hour default in place.
    timeout-minutes: 30
    if: ${{ github.event_name == 'push' || github.event_name == 'release' }}
    permissions:
      id-token: write   # required for `mcp-publisher login github-oidc`
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve package version
        id: ver
        shell: bash
        # Context values arrive as environment variables, never interpolated into the
        # run: body — github.event.release.tag_name is named by whoever cuts the release,
        # and substituting it as source text lets a crafted tag close the quote and run
        # commands. Quoting is not a mitigation: ${{ }} is replaced before any shell parses.
        env:
          PUBLISH_EVENT_NAME: ${{ github.event_name }}
          PUBLISH_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$PUBLISH_EVENT_NAME" = "release" ]; then
            v="$PUBLISH_RELEASE_TAG"
          else
            v="${GITHUB_REF_NAME}"
          fi
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved package version: $v"

      - name: Wait for package README to be live on NuGet
        # The registry verifies ownership by fetching the packed README from NuGet
        # and checking for the `mcp-name` marker. The flat-container README endpoint
        # returns 200 only once NuGet has finished validating + indexing the package.
        shell: bash
        # PUBLISH_VERSION derives from the release tag, so it is transitively
        # attacker-influenced and must not be interpolated into this run: body either.
        env:
          PUBLISH_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          id="darylmcd.roslynmcp"   # flat-container ids are lowercased
          ver="$PUBLISH_VERSION"
          url="https://api.nuget.org/v3-flatcontainer/${id}/${ver}/readme"
          echo "Polling $url"
          for i in $(seq 1 80); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            if [ "$code" = "200" ]; then
              echo "README live after ~$((i*15))s"; exit 0
            fi
            echo "attempt $i: HTTP $code; sleeping 15s"; sleep 15
          done
          echo "Timed out waiting for the NuGet package README to become available"; exit 1

      - name: Install mcp-publisher
        shell: bash
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        # `mcp-publisher publish` defaults to ./server.json; our canonical manifest
        # lives at .claude-plugin/server.json, so copy it to the expected location
        # (version-agnostic vs. relying on a positional path argument).
        shell: bash
        run: |
          cp .claude-plugin/server.json server.json
          ./mcp-publisher publish
