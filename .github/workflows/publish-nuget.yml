name: publish-nuget

# Triggered on version tag push, GitHub Release creation, or manual dispatch.
# Requires the NUGET_API_KEY repository secret (Push scope, from nuget.org/account/apikeys).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — validate and pack but do NOT push to NuGet'
        required: false
        default: 'false'
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # -NoCoverage: the release path only validates + packs; the coverage HTML/artifact
      # is never consumed here, so collecting it (~60-90s of coverlet IL-rewrite) is pure
      # waste on the publish run.
      - name: Verify release build (version drift + build + test + publish)
        shell: pwsh
        run: ./eng/verify-release.ps1 -Configuration Release -NoCoverage

      - name: Pack NuGet package
        shell: pwsh
        run: |
          dotnet pack src/RoslynMcp.Host.Stdio/RoslynMcp.Host.Stdio.csproj `
            -c Release `
            --no-build `
            -o nupkg

      - name: Verify package contents
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem -Path nupkg -Filter "*.nupkg" | Select-Object -First 1
          $snupkg = Get-ChildItem -Path nupkg -Filter "*.snupkg" | Select-Object -First 1
          if (-not $nupkg) { throw "No .nupkg found in nupkg/" }
          if (-not $snupkg) { throw "No .snupkg found in nupkg/" }
          Write-Host "Package: $($nupkg.Name) ($([math]::Round($nupkg.Length / 1MB, 2)) MB)"
          Write-Host "Symbols: $($snupkg.Name) ($([math]::Round($snupkg.Length / 1MB, 2)) MB)"

      - name: Push to NuGet
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || inputs.dry_run != 'true' }}
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw "NUGET_API_KEY secret is not set. Add it in Settings > Secrets and variables > Actions."
          }
          $nupkg = Get-ChildItem -Path nupkg -Filter "*.nupkg" | Select-Object -First 1
          dotnet nuget push $nupkg.FullName `
            --source https://api.nuget.org/v3/index.json `
            --api-key $env:NUGET_API_KEY `
            --skip-duplicate

      - name: Dry run notice
        if: ${{ inputs.dry_run == 'true' && github.event_name == 'workflow_dispatch' }}
        run: echo "Dry run — package was built and validated but NOT pushed to NuGet."

      - name: Upload NuGet packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: nupkg/

  # Publishes .claude-plugin/server.json to the official MCP Registry
  # (registry.modelcontextprotocol.io) after the NuGet package is live. Uses
  # GitHub OIDC to prove ownership of the io.github.darylmcd/* namespace — no PAT
  # or secret required. Runs only on a real tag/release publish, never on a
  # workflow_dispatch dry run. See https://modelcontextprotocol.io/registry/github-actions
  publish-registry:
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'release' }}
    permissions:
      id-token: write   # required for `mcp-publisher login github-oidc`
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve package version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            v="${{ github.event.release.tag_name }}"
          else
            v="${GITHUB_REF_NAME}"
          fi
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved package version: $v"

      - name: Wait for package README to be live on NuGet
        # The registry verifies ownership by fetching the packed README from NuGet
        # and checking for the `mcp-name` marker. The flat-container README endpoint
        # returns 200 only once NuGet has finished validating + indexing the package.
        shell: bash
        run: |
          id="darylmcd.roslynmcp"   # flat-container ids are lowercased
          ver="${{ steps.ver.outputs.version }}"
          url="https://api.nuget.org/v3-flatcontainer/${id}/${ver}/readme"
          echo "Polling $url"
          for i in $(seq 1 80); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            if [ "$code" = "200" ]; then
              echo "README live after ~$((i*15))s"; exit 0
            fi
            echo "attempt $i: HTTP $code; sleeping 15s"; sleep 15
          done
          echo "Timed out waiting for the NuGet package README to become available"; exit 1

      - name: Install mcp-publisher
        shell: bash
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        # `mcp-publisher publish` defaults to ./server.json; our canonical manifest
        # lives at .claude-plugin/server.json, so copy it to the expected location
        # (version-agnostic vs. relying on a positional path argument).
        shell: bash
        run: |
          cp .claude-plugin/server.json server.json
          ./mcp-publisher publish
