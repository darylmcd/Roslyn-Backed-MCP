name: ci

# Trigger model (see CI_POLICY.md): pull requests are the merge gate; manual
# dispatch and the weekly schedule retain coverage and live-network canaries.
# Push-to-main is intentionally absent because protected changes arrive through
# an already-validated pull request.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "45 5 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # Compute the complete validation topology before any platform job is queued.
  # Public pull-request code is always routed to ephemeral GitHub-hosted
  # runners. Every code PR receives four concurrent Windows shards and two
  # concurrent Linux shards; policy-only documentation PRs use two Linux
  # shards so every documentation contract test still executes.
  route:
    name: Route validation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs_only: ${{ steps.decide.outputs.docs_only }}
      runner_matrix: ${{ steps.decide.outputs.runner_matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Decide validation topology
        id: decide
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          # All GitHub API access lives here, at the workflow-step boundary. The topology
          # decision itself -- leg construction, docs-only classification, and the fail-closed
          # count-mismatch/cap guard -- is a pure function in eng/resolve-ci-topology.ps1, so it
          # can run (and be table-tested) outside GitHub Actions. See CiTopologyDecisionContractTests.
          $isPullRequest = '${{ github.event_name == 'pull_request' }}' -eq 'true'
          $changedFilesJson = '[]'
          $reportedChangedFileCount = $null
          if ($isPullRequest) {
            $pullRequestNumber = '${{ github.event.pull_request.number }}'
            $changedFilesJson = gh api `
              --paginate `
              --slurp `
              "repos/${{ github.repository }}/pulls/$pullRequestNumber/files?per_page=100" |
              Out-String
            if ($LASTEXITCODE -ne 0) {
              throw "Could not enumerate pull-request files and rename origins (gh exit $LASTEXITCODE)."
            }
            $reportedChangedFileCount = [int]'${{ github.event.pull_request.changed_files }}'
          }

          # eng/resolve-ci-topology.ps1 signals failure by throwing (Set-StrictMode/
          # $ErrorActionPreference = 'Stop' in that script, propagated by this step's own
          # 'Stop' preference) rather than a process exit code, so no separate $LASTEXITCODE
          # check follows this call -- an uncaught exception here already fails the step.
          $eventName = if ($isPullRequest) { 'pull_request' } else { '${{ github.event_name }}' }
          $decisionJson = & ./eng/resolve-ci-topology.ps1 `
            -EventName $eventName `
            -ChangedFilesJson $changedFilesJson `
            -ReportedChangedFileCount $reportedChangedFileCount |
            Out-String
          $decision = $decisionJson | ConvertFrom-Json -Depth 8 -ErrorAction Stop

          $matrixJson = $decision.runner_matrix | ConvertTo-Json -Compress -Depth 6 -AsArray
          "docs_only=$($decision.docs_only.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "runner_matrix=$matrixJson" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "::notice title=Validation route::$($decision.reason)"

  validate:
    name: validate-leg (${{ matrix.leg.name }})
    needs: route
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.route.outputs.runner_matrix) }}
    runs-on: ${{ matrix.leg.runs_on }}
    timeout-minutes: ${{ matrix.leg.timeout_minutes }}
    env:
      # CI fixtures are pre-restored and should fail a wedged child command
      # promptly; production defaults remain larger for arbitrary solutions.
      ROSLYNMCP_BUILD_TIMEOUT_SECONDS: "150"
      ROSLYNMCP_TEST_TIMEOUT_SECONDS: "300"
      ROSLYNMCP_VULN_SCAN_TIMEOUT_SECONDS: "120"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Platform-neutral policy and release-artifact work executes on the sole
      # hosted Linux artifact owner. Other PR legs restore/build/test only.
      - name: Verify changelog contract
        if: matrix.leg.artifact_owner == true && needs.route.outputs.docs_only == 'true'
        shell: pwsh
        run: ./eng/verify-changelog-fragments.ps1

      - name: Validate AI docs
        if: matrix.leg.artifact_owner == true
        shell: pwsh
        run: ./eng/verify-ai-docs.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Verify release build (pull request)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $parameters = @{
            Configuration = 'Release'
            NoCoverage = $true
            ExcludeNetworkTests = $true
            TestShardIndex = ${{ matrix.leg.test_shard_index }}
            TestShardCount = ${{ matrix.leg.test_shard_count }}
          }
          if ('${{ matrix.leg.artifact_owner }}' -ne 'true' -or
              '${{ needs.route.outputs.docs_only }}' -eq 'true') {
            $parameters.TestShardOnly = $true
          }
          ./eng/verify-release.ps1 @parameters

      - name: Verify changed-file formatting
        if: github.event_name == 'pull_request' && matrix.leg.artifact_owner == true && needs.route.outputs.docs_only != 'true'
        shell: pwsh
        run: ./eng/verify-changed-format.ps1 -BaseRef origin/${{ github.base_ref }} -NoRestore

      - name: Verify release build (dispatch / schedule)
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./eng/verify-release.ps1 -Configuration Release

      - name: Audit packages for known vulnerabilities
        if: needs.route.outputs.docs_only != 'true' && matrix.leg.artifact_owner == true
        shell: pwsh
        run: ./eng/verify-nuget-audit.ps1 -SolutionPath RoslynMcp.slnx

      - name: Summarize test timings
        if: always()
        shell: pwsh
        run: ./eng/summarize-test-results.ps1 -ResultsPath artifacts/test-results -OutputPath $env:GITHUB_STEP_SUMMARY

      # Upload every TRX even when its release step fails. Per-leg names prevent
      # artifact collisions and make slow-test evidence available on both OSes.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ matrix.leg.name }}
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Generate coverage HTML summary
        if: github.event_name != 'pull_request' && matrix.leg.artifact_owner == true
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.7 --no-cache
          $tools = Join-Path $env:HOME '.dotnet/tools'
          $env:PATH = "$tools$([IO.Path]::PathSeparator)$env:PATH"
          $files = Get-ChildItem -Path 'artifacts/coverage' -Recurse -Filter 'coverage.cobertura.xml' -ErrorAction Stop
          if (-not $files) { throw 'No coverage.cobertura.xml under artifacts/coverage' }
          $reports = ($files | ForEach-Object { $_.FullName }) -join ';'
          $target = Join-Path $PWD 'artifacts/coverage/report'
          reportgenerator "-reports:$reports" "-targetdir:$target" -reporttypes:HtmlSummary

      - name: Upload published host artifact
        if: needs.route.outputs.docs_only != 'true' && matrix.leg.artifact_owner == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: host-stdio-publish
          path: artifacts/publish/host-stdio
          retention-days: 14

      - name: Upload release manifest
        if: needs.route.outputs.docs_only != 'true' && matrix.leg.artifact_owner == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-manifests
          path: artifacts/manifests
          retention-days: 14

      - name: Upload code coverage
        if: github.event_name != 'pull_request' && matrix.leg.artifact_owner == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-coverage
          path: artifacts/coverage
          retention-days: 30

  # Bound the declared SDK floor independently of the latest-10.0 full matrix.
  # This lane restores/builds the product and loads one real MSBuildWorkspace;
  # repeating the complete suite here would add cost without another test shape.
  sdk_floor:
    name: sdk-floor (10.0.400)
    needs: route
    if: github.event_name != 'pull_request' || needs.route.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROSLYNMCP_BUILD_TIMEOUT_SECONDS: "150"
      ROSLYNMCP_TEST_TIMEOUT_SECONDS: "300"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Keep the floor SDK out of the hosted image's shared /usr/share/dotnet tree;
      # global.json intentionally permits later feature bands for normal development.
      # The runner context is available to steps, but not to job-level env expressions.
      - name: Configure isolated SDK install root
        shell: pwsh
        run: |
          "DOTNET_INSTALL_DIR=$($env:RUNNER_TEMP)/dotnet-floor" >> $env:GITHUB_ENV
          "DOTNET_MULTILEVEL_LOOKUP=0" >> $env:GITHUB_ENV

      - name: Set up exact floor SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400

      - name: Require exact floor selection
        shell: pwsh
        run: |
          $actual = (dotnet --version).Trim()
          if ($actual -cne '10.0.400') {
            throw "Expected exact SDK floor 10.0.400 but dotnet selected '$actual'."
          }

      - name: Restore and build at the SDK floor
        shell: pwsh
        run: |
          dotnet restore RoslynMcp.slnx --nologo
          if ($LASTEXITCODE -ne 0) { throw "Floor-SDK solution restore failed with exit code $LASTEXITCODE." }
          dotnet restore samples/SampleSolution/SampleSolution.slnx --nologo
          if ($LASTEXITCODE -ne 0) { throw "Floor-SDK sample restore failed with exit code $LASTEXITCODE." }
          dotnet build RoslynMcp.slnx -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw "Floor-SDK build failed with exit code $LASTEXITCODE." }

      - name: Load a representative MSBuild workspace at the SDK floor
        shell: pwsh
        run: |
          dotnet test tests/RoslynMcp.Tests/RoslynMcp.Tests.csproj `
            -c Release `
            --no-build `
            --nologo `
            --filter "FullyQualifiedName=RoslynMcp.Tests.IntegrationTests_WorkspaceCore.Workspace_Load_Returns_WorkspaceId_And_Metadata" `
            --settings eng/ci.runsettings `
            --logger "console;verbosity=minimal"
          if ($LASTEXITCODE -ne 0) { throw "Floor-SDK workspace-load probe failed with exit code $LASTEXITCODE." }

  # Stable branch-protection context. Dynamic leg names are intentionally not
  # required individually; this aggregator fails unless the complete matrix did.
  validate-gate:
    # A dispatch/schedule run may target a feature-branch SHA but validates only
    # one informational Linux leg. Give it a different check context so it can
    # never satisfy the pull-request ruleset's required `validate` context.
    name: ${{ github.event_name == 'pull_request' && 'validate' || 'validate-informational' }}
    needs:
      - route
      - validate
      - sdk_floor
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require routing and every validate leg green
        shell: pwsh
        run: |
          $routeResult = '${{ needs.route.result }}'
          $validateResult = '${{ needs.validate.result }}'
          $sdkFloorResult = '${{ needs.sdk_floor.result }}'
          $docsOnly = '${{ needs.route.outputs.docs_only }}' -eq 'true'
          $sdkFloorSucceeded = $sdkFloorResult -eq 'success' -or ($docsOnly -and $sdkFloorResult -eq 'skipped')
          if ($routeResult -ne 'success' -or $validateResult -ne 'success' -or -not $sdkFloorSucceeded) {
            throw "Validation did not fully succeed (route: $routeResult; matrix: $validateResult; SDK floor: $sdkFloorResult)."
          }
          Write-Host 'Routing, all validate legs, and the required SDK-floor probe succeeded.'
